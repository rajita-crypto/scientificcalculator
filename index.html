<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <input id="display" type="text" readonly />

      <div class="buttons">
        <button data-action="clear" class="btn clear">AC</button>
        <button data-action="delete" class="btn delete">DEL</button>
        <button data-value="(" class="btn operator">(</button>
        <button data-value=")" class="btn operator">)</button>

        <button data-value="sin(" class="btn function">sin</button>
        <button data-value="cos(" class="btn function">cos</button>
        <button data-value="tan(" class="btn function">tan</button>
        <button data-value="/" class="btn operator">÷</button>

        <button data-value="log(" class="btn function">log</button>
        <button data-value="ln(" class="btn function">ln</button>
        <button data-value="sqrt(" class="btn function">sqrt</button>
        <button data-value="*" class="btn operator">×</button>

        <button data-value="pi" class="btn function">π</button>
        <button data-value="e" class="btn function">e</button>
        <button data-value="^" class="btn operator">^</button>
        <button data-value="-" class="btn operator">−</button>

        <button data-value="7" class="btn number">7</button>
        <button data-value="8" class="btn number">8</button>
        <button data-value="9" class="btn number">9</button>
        <button data-value="+" class="btn operator">+</button>

        <button data-value="4" class="btn number">4</button>
        <button data-value="5" class="btn number">5</button>
        <button data-value="6" class="btn number">6</button>

        <button data-value="1" class="btn number">1</button>
        <button data-value="2" class="btn number">2</button>
        <button data-value="3" class="btn number">3</button>

        <button data-value="0" class="btn number zero">0</button>
        <button data-value="." class="btn number">.</button>
        <button data-action="equals" class="btn equal">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
